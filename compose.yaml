services:
  catalog:
    build:
      context: ./catalog
    container_name: CatalogAPI
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://catalogMongoDB:27017/ticketmanager
    depends_on:
      - catalogMongoDB
    networks:
      - ticket-manager-network

  catalogMongoDB:
    image: mongo:latest
    container_name: CatalogMongoDB
    ports:
      - 27017:27017
    volumes:
      - ./MongoDB/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - ./MongoDB/data:/docker-entrypoint-initdb.d/seed-data:ro
    networks:
      - ticket-manager-network
  
  basket:
    build:
      context: ./basket
    container_name: BasketServiceAPI
    ports:
      - "8082:8082"
    depends_on:
      - basketRedisDB
    networks:
      - ticket-manager-network

  basketRedisDB:
    image: redis:latest
    container_name: BasketRedisDB
    ports:
      - 6379:6379
    networks:
      - ticket-manager-network

  user:
    build:
      context: ./UserService
    container_name: UserServiceAPI
    ports: 
      - "8085:8080"
    depends_on:
      - userSQLDB
    networks:
      - ticket-manager-network
    # restart: "on-failure"

  userSQLDB:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: UserSQLDB
    ports:
      - 1434:1433
    environment:
      - SA_PASSWORD=dev123!!
      - MSSQL_DATABASE=UserServiceDB
      - ACCEPT_EULA=Y
    volumes:
      - userservicevolume:/var/opt/mssql
      - ./SQL/DBSetup.sql:/docker-entrypoint-initdb.d/DBSetup.sql:ro
    networks:
      - ticket-manager-network

  rabbitMQ:
    image: rabbitmq:3-management
    container_name: RabbitMQ
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=dev123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

networks:
  ticket-manager-network:
    driver: bridge

volumes:
  userservicevolume:
  rabbitmq_data: